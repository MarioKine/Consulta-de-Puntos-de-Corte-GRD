# Este es un archivo de configuración de tema para Streamlit
# Guárdalo en: .streamlit/config.toml

[theme]

# Color primario (botones, sliders, etc.) - Un azul "Salud"
primaryColor="#0068c9"

# Color de fondo principal de la app
backgroundColor="#F0F2F6"

# Color de fondo de las barras laterales y elementos secundarios
secondaryBackgroundColor="#FFFFFF"

# Color del texto principal
textColor="#0D1117"

# Fuente
font="sans serif"
